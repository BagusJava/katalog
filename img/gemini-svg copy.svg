<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradasi Warna Api Latar -->
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#d84315" />
    </radialGradient>
  </defs>
  
  <!-- Lingkaran Dasar -->
  <circle cx="50" cy="50" r="48" fill="url(#fireGlow)" />
  <circle cx="50" cy="50" r="45" fill="#111827" />

  <!-- Layer 1: Api Besar di belakang -->
  <text x="50" y="58" font-size="55" text-anchor="middle" dominant-baseline="middle">🔥</text>
  
  <!-- Layer 2: Siput di tengah kiri -->
  <text x="35" y="65" font-size="30" text-anchor="middle" dominant-baseline="middle">🐌</text>
  
  <!-- Layer 3: Pelari di depan kanan -->
  <text x="65" y="65" font-size="40" text-anchor="middle" dominant-baseline="middle">🏃‍♂️</text>
</svg>